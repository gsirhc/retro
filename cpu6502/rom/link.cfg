MEMORY {
	ZP:				start = $0000, 	size = $0100, 	type = rw;
	# STACK is $0100-$01FF
	SERIAL_BUFFER:	start = $0200, 	size = $0100, 	type = rw, file = "";
	# Wozmon's line buffer; the editor's source/symbol/object regions are
	# further up in RAM ($0400-$3FFF) and addressed directly by editor.s,
	# not listed here -- they're not ROM-resident data, just RAM the code
	# reads/writes at fixed addresses.
	WOZMON_BUFFER:	start = $0300, 	size = $0100, 	type = rw, file = "";
	ROM:			start = $8000, 	size = $7E00, 	fill = yes, file = %O;
	WOZMON:			start = $FE00, 	size = $1FA, 	fill = yes, file = %O;
	RESETVEC:		start = $FFFA, 	size = 6, 		fill = yes, file = %O;
}

SEGMENTS {
	ZEROPAGE:		load = ZP, 				type = zp;
	SERIAL_BUFFER: 	load = SERIAL_BUFFER, 	type = rw;
	WOZMON_BUFFER:	load = WOZMON_BUFFER, 	type = rw;
	BIOS: 			load = ROM, 			type = ro;
	EDITOR:			load = ROM,				type = ro;
	WOZMON: 		load = WOZMON, 			type = ro;
	RESETVEC: 		load = RESETVEC, 		type = ro;
}
