<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RETRO — vintage machines in your browser</title>
<!-- Site icon: a CRT-with-circuit-traces glyph, cropped/resized from a
     user-supplied source image -- see assets/README.md for provenance and
     how to regenerate. Shared across the landing page and every machine
     (each machine's own web/assets/ holds a copy -- only web/ ever gets
     staged, see CLAUDE.md "Wiring a machine into the site"). -->
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- apply the shared site theme before first paint, so there's no flash of
     the wrong theme (see the inline script below, which mirrors every
     machine page's own shared/theme-init.js) -->
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/footer.css">
<style>
  /* ---- page themes: default = Windows 95; web94 = mid-90s Mosaic web;
     modern = clean; the color palette for all five themes (moderndark and
     ai included) lives in shared/theme.css (linked above) -- editing a
     color there reaches this page and every machine. This page has no
     build step, so it links that file straight from its own sibling
     shared/ directory rather than a copied web/shared/ (see each machine's
     web/Makefile `shared` target for that copy). Only --title-font (this
     page's own heading size, which varies with its own header layout, not
     the theme) stays local, below. */
  :root { --title-font: 900 30px "Arial Black", Arial, sans-serif; }
  :root[data-theme="web94"] { --title-font: bold 26px "Times New Roman", Times, serif; }
  :root[data-theme="modern"] { --title-font: 700 28px/1.15 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  /* "AI Generated" -- a for-fun fifth theme: a ChatGPT-generated circuit-board
     image (assets/ai-theme-bg.jpg, every CPU this repo emulates soldered onto
     one glossy green board, hallucinated part numbers and all) behind glassy,
     gradient-bordered panels. Same token set as every other theme here, just
     leaning all the way into the generic purple/cyan "AI product" gradient
     look on purpose. */
  :root[data-theme="ai"] { --title-font: 800 30px/1.15 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  :root[data-theme="ai"] body {
    background:
      linear-gradient(180deg, rgba(8,6,18,.55), rgba(8,6,18,.68)),
      url("assets/ai-theme-bg.jpg") center/cover fixed;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  :root[data-theme="ai"] .theme-pick select { border-radius: 6px; padding: 4px 8px; }
  :root[data-theme="ai"] .section-heading { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--muted); }
  :root[data-theme="ai"] .machine-card .shot { border-radius: 6px; }
  :root[data-theme="ai"] .machine-card:hover {
    box-shadow: 0 6px 22px rgba(123,47,247,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--desktop);
    color: var(--text);
    font: 16px/1.5 var(--body-font);
    min-height: 100vh;
    padding: 28px 14px;
  }
  .page {
    max-width: 780px;
    margin: 0 auto;
    background: var(--page-bg);
    border: var(--page-border);
    border-radius: var(--page-radius);
    box-shadow: var(--page-shadow);
  }
  .titlebar {
    display: var(--titlebar-display);
    align-items: center; justify-content: space-between;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font: bold 13px "MS Sans Serif", Tahoma, sans-serif;
    padding: 3px 4px 3px 8px;
  }
  .titlebar .btns span {
    display: inline-block; width: 16px; height: 14px; margin-left: 2px;
    background: #c0c0c0; border: 1px outset #dfdfdf; color: #000;
    text-align: center; line-height: 12px; font-size: 10px;
  }
  .titlebar .win-icon { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
  .inner { padding: 22px 26px 26px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  /* Same source icon as the favicon/window icon (see assets/README.md) --
     referencing the 512px master rather than a small favicon variant so it
     stays crisp at this larger, on-page size (including on retina, where
     the browser's own high-quality downsample beats upscaling a tiny one). */
  .site-icon { width: 56px; height: 56px; flex: 0 0 auto; border-radius: 4px; }
  .brand-text { min-width: 0; }
  h1 {
    margin: 0; font: var(--title-font); color: var(--title-color);
    text-shadow: var(--title-shadow); letter-spacing: 2px;
  }
  .theme-pick { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .theme-pick select {
    font: inherit; background: var(--field-bg); border: var(--field-border);
    color: var(--text); padding: 2px 4px;
  }
  :root[data-theme="modern"] .theme-pick select { border-radius: 6px; padding: 4px 8px; }

  .tagline { margin: 8px 0 0; color: var(--muted); }

  .section-heading {
    margin: 30px 0 14px; padding-top: 18px; border-top: var(--card-border);
    font: bold 15px Arial, Helvetica, sans-serif; color: var(--text);
    letter-spacing: .5px; text-transform: uppercase;
  }
  :root[data-theme="web94"] .section-heading { font: bold 17px "Times New Roman", Times, serif; letter-spacing: normal; text-transform: none; }
  :root[data-theme="modern"] .section-heading { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--muted); }

  .machines {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }

  .machine-card {
    display: flex; flex-direction: column; padding: 0;
    text-decoration: none; color: inherit;
    background: var(--card-bg); border: var(--card-border);
    border-radius: var(--card-radius); overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .machine-card:hover { transform: translateY(-2px); }
  :root[data-theme="modern"] .machine-card:hover {
    box-shadow: 0 6px 20px rgba(16,24,40,.12);
  }
  :root:not([data-theme="modern"]) .machine-card:active { border-style: inset; }

  /* Thumbnail-only tiles. Shots are 286×128 (2.234:1) except the AT fascia
     (712×128); object-fit: cover + left keeps that crop on the badge/LEDs. */
  .machine-card .shot {
    display: block; width: 100%; height: auto; aspect-ratio: 286 / 128;
    object-fit: cover; object-position: left center;
  }
  .machine-card .name {
    display: block; padding: 8px 8px 10px; text-align: center;
    font-weight: 700; font-size: 13px; letter-spacing: .3px;
  }

  a { color: var(--link); }
</style>
</head>
<body>
<script>try{var t=localStorage.getItem("retro8080.theme")||"win",r=document.documentElement;if(t=="moderndark"){r.dataset.theme="modern";r.dataset.mode="dark";}else{r.dataset.theme=t;}}catch(e){}</script>

<div class="page">
  <div class="titlebar">
    <span><img class="win-icon" src="assets/favicon-32.png" alt="" aria-hidden="true"> RETRO</span>
    <span class="btns"><span>_</span><span>&#9633;</span><span>&times;</span></span>
  </div>

  <div class="inner">
    <header>
      <div class="brand">
        <img class="site-icon" src="assets/icon-512.png" width="56" height="56" decoding="async" alt="">
        <div class="brand-text">
          <h1>RETRO</h1>
          <p class="tagline">Vintage machines, running entirely in your browser.</p>
        </div>
      </div>
      <label class="theme-pick">Theme:
        <select id="pageTheme">
          <option value="win">Windows 95</option>
          <option value="web94">Mid-1990s Web</option>
          <option value="modern">Modern</option>
          <option value="moderndark">Dark Modern</option>
          <option value="ai">AI Generated</option>
        </select>
      </label>
    </header>

    <div class="machines">
      <a class="machine-card" href="altair8800/">
        <img class="shot" src="assets/altair-panel.jpg" width="286" height="128"
             decoding="async" alt="Altair 8800 front panel">
        <span class="name">MITS Altair 8800</span>
      </a>
      <a class="machine-card" href="ibmpc-at/">
        <img class="shot" src="assets/ibmpcat-panel.jpg" width="712" height="128"
             decoding="async" alt="IBM PC/AT front panel, powered on">
        <span class="name">IBM PC/AT</span>
      </a>
    </div>

    <h2 class="section-heading">Arcade: Z-80 Powered</h2>
    <div class="machines">
      <a class="machine-card" href="frogger/">
        <img class="shot" src="assets/frogger-cabinet.png" width="286" height="128"
             decoding="async" alt="Original Frogger arcade tile, starfield and Courier New lettering">
        <span class="name">Frogger Arcade</span>
      </a>
      <a class="machine-card" href="galaxian/">
        <img class="shot" src="assets/galaxian-cabinet.png" width="286" height="128"
             decoding="async" alt="Original Galaxian arcade tile, starfield and Courier New lettering">
        <span class="name">Galaxian Arcade</span>
      </a>
      <a class="machine-card" href="pacman/?game=mspacman">
        <img class="shot" src="assets/mspacman-cabinet.png" width="286" height="128"
             decoding="async" alt="Original Ms. Pac-Man arcade tile, starfield and Courier New lettering">
        <span class="name">Ms. Pac-Man Arcade</span>
      </a>
      <a class="machine-card" href="pacman/">
        <img class="shot" src="assets/pacman-cabinet.png" width="286" height="128"
             decoding="async" alt="Original Pac-Man arcade tile, starfield and Courier New lettering">
        <span class="name">Pac-Man Arcade</span>
      </a>
      <a class="machine-card" href="scramble/">
        <img class="shot" src="assets/scramble-cabinet.png" width="286" height="128"
             decoding="async" alt="Original Scramble arcade tile, starfield and Courier New lettering">
        <span class="name">Scramble Arcade</span>
      </a>
    </div>

    <h2 class="section-heading">Homebrew</h2>
    <div class="machines">
      <a class="machine-card" href="assembler6502/">
        <img class="shot" src="assets/cg-oac-6502-board.svg" width="286" height="128"
             decoding="async" alt="6502 Assembler board and terminal">
        <span class="name">6502 Assembler</span>
      </a>
    </div>
  </div>
</div>

<script>
  (function () {
    var root = document.documentElement;
    var sel = document.getElementById("pageTheme");
    var VALUES = ["win", "web94", "modern", "moderndark", "ai"];
    function apply(v) {
      if (VALUES.indexOf(v) < 0) v = "win";
      if (v === "moderndark") { root.dataset.theme = "modern"; root.dataset.mode = "dark"; }
      else { root.dataset.theme = v; delete root.dataset.mode; }
      return v;
    }
    var saved;
    try { saved = localStorage.getItem("retro8080.theme"); } catch (e) {}
    sel.value = apply(saved || "win");
    sel.addEventListener("change", function () {
      apply(sel.value);
      try { localStorage.setItem("retro8080.theme", sel.value); } catch (e) {}
    });
  })();
</script>
<script src="shared/footer.js"></script>
</body>
</html>
