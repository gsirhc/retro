    --page-bg:   #c0c0c0;
    --page-border: 3px ridge #dfdfdf;
    --page-shadow: none;
    --title-font: bold 26px "Times New Roman", Times, serif;
    --title-color: #1a1a1a;
    --title-shadow: none;
    --card-border: 2px outset #dfdfdf;
    --titlebar-display: none;
  }
  :root[data-theme="modern"] {
    --desktop:   #eceef2;
    --page-bg:   #ffffff;
    --page-border: 1px solid #e4e6ea;
    --page-radius: 14px;
    --page-shadow: 0 1px 3px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.10);
    --body-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --text:      #1b1e24;
    --muted:     #6b7280;
    --link:      #4f46e5;
    --title-font: 700 28px/1.15 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --title-color: #12141a;
    --title-shadow: none;
    --card-bg:     #ffffff;
    --card-border: 1px solid #e7e9ee;
    --card-radius: 12px;
    --field-bg:     #ffffff;
    --field-border: 1px solid #d3d7de;
    --titlebar-display: none;
  }
  /* Dark Modern — Modern layout, dark palette (theme scripts set
     data-theme="modern" + data-mode="dark") */
  :root[data-theme="modern"][data-mode="dark"] {
    color-scheme: dark;
    --desktop:   #121317;
    --page-bg:   #1b1d22;
    --page-border: 1px solid #2c2f37;
    --page-shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 44px rgba(0,0,0,.55);
    --text:      #d7dae0;
    --muted:     #9aa0aa;
    --link:      #a9a3ff;
    --title-color: #f1f2f5;
    --card-bg:     #23262d;
    --card-border: 1px solid #31353e;
    --field-bg:     #2a2e37;
    --field-border: 1px solid #3a3f4a;
  }
  :root[data-theme="modern"][data-mode="dark"] .machine-card:hover {
    box-shadow: 0 6px 22px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--desktop);
    color: var(--text);
    font: 16px/1.5 var(--body-font);
    min-height: 100vh;
    padding: 28px 14px;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    background: var(--page-bg);
    border: var(--page-border);
    border-radius: var(--page-radius);
    box-shadow: var(--page-shadow);
  }
  .titlebar {
    display: var(--titlebar-display);
    align-items: center; justify-content: space-between;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font: bold 13px "MS Sans Serif", Tahoma, sans-serif;
    padding: 3px 4px 3px 8px;
  }
  .titlebar .btns span {
    display: inline-block; width: 16px; height: 14px; margin-left: 2px;
    background: #c0c0c0; border: 1px outset #dfdfdf; color: #000;
    text-align: center; line-height: 12px; font-size: 10px;
  }
  .inner { padding: 22px 26px 26px; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font: var(--title-font); color: var(--title-color);
    text-shadow: var(--title-shadow); letter-spacing: 2px;
  }
  .theme-pick { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .theme-pick select {
    font: inherit; background: var(--field-bg); border: var(--field-border);
    color: var(--text); padding: 2px 4px;
  }
  :root[data-theme="modern"] .theme-pick select { border-radius: 6px; padding: 4px 8px; }

  .tagline { margin: 10px 0 22px; color: var(--muted); }

  .machines { display: grid; gap: 16px; }

  .machine-card {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 14px; text-decoration: none; color: inherit;
    background: var(--card-bg); border: var(--card-border);
    border-radius: var(--card-radius);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .machine-card:hover { transform: translateY(-2px); }
  :root[data-theme="modern"] .machine-card:hover {
    box-shadow: 0 6px 20px rgba(16,24,40,.12);
  }
  :root:not([data-theme="modern"]) .machine-card:active { border-style: inset; }

  /* ---- thumbnail of the emulator's own rendered front panel ---- */
  .machine-card .shot {
    flex: 0 0 auto; height: 64px; width: auto; display: block;
    border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  :root[data-theme="modern"] .machine-card .shot { border-radius: 6px; }

  .machine-card .name {
    flex: 1; min-width: 0; font-weight: 700; font-size: 17px; letter-spacing: .5px;
  }
  .machine-card .go {
    color: var(--link); font-size: 13px; font-weight: 700; white-space: nowrap;
  }

  a { color: var(--link); }
</style>
</head>
<body>
<script>try{var t=localStorage.getItem("retro8080.theme")||"win",r=document.documentElement;if(t=="moderndark"){r.dataset.theme="modern";r.dataset.mode="dark";}else{r.dataset.theme=t;}}catch(e){}</script>

<div class="page">
  <div class="titlebar">
    <span>&#9635; RETRO</span>
    <span class="btns"><span>_</span><span>&#9633;</span><span>&times;</span></span>
  </div>

  <div class="inner">
    <header>
      <h1>RETRO</h1>
      <label class="theme-pick">Theme:
        <select id="pageTheme">
          <option value="win">Windows 95</option>
          <option value="web94">Mid-1990s Web</option>
          <option value="modern">Modern</option>
          <option value="moderndark">Dark Modern</option>
        </select>
      </label>
    </header>

    <p class="tagline">Vintage machines, running entirely in your browser.</p>

    <div class="machines">
      <a class="machine-card" href="altair8800/">
        <img class="shot" src="assets/altair-panel.jpg" width="286" height="128"
             decoding="async" alt="Altair 8800 front panel">
        <span class="name">MITS Altair 8800</span>
        <span class="go">Launch &rarr;</span>
      </a>
    </div>
  </div>
</div>

<script>
  (function () {
    var root = document.documentElement;
    var sel = document.getElementById("pageTheme");
    var VALUES = ["win", "web94", "modern", "moderndark"];
    function apply(v) {
      if (VALUES.indexOf(v) < 0) v = "win";
      if (v === "moderndark") { root.dataset.theme = "modern"; root.dataset.mode = "dark"; }
      else { root.dataset.theme = v; delete root.dataset.mode; }
      return v;
    }
    var saved;
    try { saved = localStorage.getItem("retro8080.theme"); } catch (e) {}
    sel.value = apply(saved || "win");
    sel.addEventListener("change", function () {
      apply(sel.value);
      try { localStorage.setItem("retro8080.theme", sel.value); } catch (e) {}
    });
  })();
</script>
</body>
</html>
