name: Fetch Altair media
description: >
  Fetch (cached) the pinned + checksummed Altair 4K/8K BASIC images and the
  CP/M 2.2 diskette into Emulator8080/web. Shared by the build and web-test jobs.

runs:
  using: composite
  steps:
    # Cached on the fetch scripts' content — a cache hit skips every download.
    - name: Cache Altair BASIC + CP/M
      uses: actions/cache@v4
      with:
        path: |
          Emulator8080/web/roms/8kbas.bin
          Emulator8080/web/roms/4kbas.bin
          Emulator8080/web/roms/8kBas_e0.bin
          Emulator8080/web/roms/8kBas_e8.bin
          Emulator8080/web/roms/8kBas_f0.bin
          Emulator8080/web/roms/8kBas_f8.bin
          Emulator8080/web/disks/cpm63k.dsk
        key: altair-media-${{ hashFiles('Emulator8080/web/roms/fetch-basic.sh', 'Emulator8080/web/disks/fetch-cpm.sh') }}

    - shell: bash
      working-directory: Emulator8080/web
      run: |
        bash roms/fetch-basic.sh
        bash disks/fetch-cpm.sh
