name: Arcade web test

# One cabinet's Playwright suite. deploy-emulator.yml calls it with test-smoke,
# nightly-full.yml with test.

on:
  workflow_call:
    inputs:
      machine:
        required: true
        type: string
      target:
        required: true
        type: string
      fail-on-flaky:
        type: boolean
        default: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      FAIL_ON_FLAKY: ${{ inputs.fail-on-flaky && '1' || '' }}
    defaults:
      run:
        working-directory: retroweb/${{ inputs.machine }}/web
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12

      - run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: make ${{ inputs.target }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.machine }}-playwright-report
          path: |
            retroweb/${{ inputs.machine }}/web/playwright-report/
            retroweb/${{ inputs.machine }}/web/test-results/
          retention-days: 7
