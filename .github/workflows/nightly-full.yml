name: Nightly full tests

# Full native + Playwright suites for every machine (and shared Z80).
# Deploy CI (deploy-emulator.yml) runs smoke only. See CLAUDE.md "Smoke vs full".

on:
  schedule:
    # 08:00 UTC daily (~01:00 Pacific)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  altair8800-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # native echo demo + GoogleTest unit suite
      - run: make -C retroweb/altair8800 check

      # the diagnostic COMs + CP/M disk this job downloads (pins live in this
      # file, so key the cache on it) -- a cache hit skips both fetch steps
      - name: Cache test images
        id: test-images
        uses: actions/cache@v4
        with:
          path: |
            retroweb/altair8800/cpm/8080PRE.COM
            retroweb/altair8800/cpm/TST8080.COM
            retroweb/altair8800/cpm/CPUTEST.COM
            retroweb/altair8800/cpm/8080EXM.COM
            retroweb/altair8800/cpm/cpm22.dsk
          key: test-images-${{ hashFiles('.github/workflows/nightly-full.yml') }}

      # public-domain 8080 diagnostics (kept out of the repo), pinned + checksummed
      - name: Fetch 8080 diagnostic images
        if: steps.test-images.outputs.cache-hit != 'true'
        working-directory: retroweb/altair8800/cpm
        run: |
          base=https://raw.githubusercontent.com/superzazu/8080/c5d403ce7ac967b6ec4980a45b5447d8880888b0/cpu_tests
          for f in 8080PRE.COM TST8080.COM CPUTEST.COM 8080EXM.COM; do
            curl -sSfL -o "$f" "$base/$f"
          done
          sha256sum -c <<'EOF'
          18eb3c79cba42c0718f160be6a1853cb64cdce7aa47d65780189a57bdd98c4e0  8080PRE.COM
          9561c6fb6c99efe3de00eb77e4044fd102151058b39ac2d7bce10483838a08e7  TST8080.COM
          e61a9a75348c774486c2207080ea4effbf6c2367fdace31b0731081a4144030b  CPUTEST.COM
          6e3286e11bb1a8f47b8ee1280b4a067be813193363e3223c99b0d21912f44aeb  8080EXM.COM
          EOF

      # 8080PRE / TST8080 / CPUTEST / 8080EXM via the CP/M host (exits non-zero on failure)
      - run: make -C retroweb/altair8800 cpm

      # a real Altair CP/M 2.2 disk (kept out of the repo), pinned + checksummed
      - name: Fetch a CP/M diskette image
        if: steps.test-images.outputs.cache-hit != 'true'
        working-directory: retroweb/altair8800/cpm
        run: |
          url=https://raw.githubusercontent.com/dhansel/Altair8800/8b0ac49448144f0afed1d5108559dc8507268a85/disks/DISK01.DSK
          curl -sSfL -o cpm22.dsk "$url"
          sha256sum -c <<'EOF'
          730a806ae374c99d8c1ee1c4ab83b674ea7773050300c7d7aa4bfbd29752e4f2  cpm22.dsk
          EOF

      # boot CP/M on the emulated 88-DCDD and run DIR/STAT (exits non-zero if it hangs)
      - run: make -C retroweb/altair8800 cpmdisk DISK=cpm/cpm22.dsk

  # Full Playwright suite (every control / fidelity case). Smoke is deploy CI.
  altair8800-web-test:
    needs: altair8800-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/altair8800/web
        run: make retro8080.js roms shared

      - uses: ./.github/actions/fetch-altair-media

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/altair8800/web
        run: npm ci

      - working-directory: retroweb/altair8800/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/altair8800/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            retroweb/altair8800/web/playwright-report/
            retroweb/altair8800/web/test-results/
          retention-days: 7

  # 6502 Assembler: GoogleTest suite + Klaus Dormann's 6502/65C02 functional
  # test suites, plus building the real ROM from cpu6502/rom/ source (cc65,
  # not fetched -- see CGOAC6502_REVIEW.md §8).
  assembler6502-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65
      - run: make -C retroweb/assembler6502 check

  # Playwright suite for the 6502 Assembler front end: boots the real ROM,
  # drives the board controls, terminal, and ROM programmer in a real browser.
  assembler6502-web-test:
    needs: assembler6502-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/assembler6502/web
        run: make wasm roms examples-bin shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/assembler6502/web
        run: npm ci

      - working-directory: retroweb/assembler6502/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/assembler6502/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgoac6502-playwright-report
          path: |
            retroweb/assembler6502/web/playwright-report/
            retroweb/assembler6502/web/test-results/
          retention-days: 7

  # IBM PC/AT: GoogleTest suite over the 80286 core + AT chipset (see
  # IBM_PCAT_REVIEW.md).
  ibmpcat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/ibmpc-at check

  # Playwright suite for the IBM PC/AT front end: boots the real 80286 core
  # + shipped FreeDOS HDD image, drives keyboard/floppy/HDD/speaker/theme
  # controls and asserts EGA text-mode screen contents (see
  # IBM_PCAT_REVIEW.md's Playwright section). Shares the same cached HDD
  # image build as the `build` job below -- see its own comment on the
  # cache step.
  ibmpcat-web-test:
    needs: ibmpcat-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/ibmpc-at/web
        run: make roms

      - name: Cache IBM PC/AT FreeDOS HDD image
        id: ibmpcat-hdd
        uses: actions/cache@v4
        with:
          path: retroweb/ibmpc-at/disks/freedos-hdd.img
          key: ibmpcat-hdd-${{ hashFiles('retroweb/ibmpc-at/*.h', 'retroweb/ibmpc-at/*.cpp', 'retroweb/ibmpc-at/disks/*.cpp', 'retroweb/ibmpc-at/disks/*.sh', 'retroweb/ibmpc-at/roms/*.sh') }}

      - name: Build IBM PC/AT FreeDOS HDD image
        if: steps.ibmpcat-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/ibmpc-at hdd-image

      - working-directory: retroweb/ibmpc-at/web
        run: make ibmpcat.js hdd-image

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/ibmpc-at/web
        run: make test-install

      - working-directory: retroweb/ibmpc-at/web
        run: make test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ibmpcat-playwright-report
          path: |
            retroweb/ibmpc-at/web/playwright-report/
            retroweb/ibmpc-at/web/test-results/
          retention-days: 7

  # Pac-Man arcade board: GoogleTest suite over the tilemap/sprite video
  # + Namco WSG + machine (see retroweb/pacman/PACMAN_REVIEW.md). The
  # shared Z80 ISA is z80-test, not this job; Smoke.HwtestBoots* is the
  # board-level "this CPU actually runs here" check.
  pacman-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/pacman check

  # Playwright suite for the Pac-Man front end: boots the built-in hardware
  # self-test ROM (no Namco IP), drives keyboard/theme controls, and
  # exercises the user-supplied ROM-set loader against fixture CRCs.
  pacman-web-test:
    needs: pacman-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/pacman/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/pacman/web
        run: npm ci

      - working-directory: retroweb/pacman/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/pacman/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pacman-playwright-report
          path: |
            retroweb/pacman/web/playwright-report/
            retroweb/pacman/web/test-results/
          retention-days: 7

  # 486DX2-66 Gaming PC: GoogleTest suite over the 80486 core + chipset,
  # WD1003/ATAPI CD-ROM, floppy, VGA/VBE, PS/2 mouse and Sound Blaster 16
  # (see retroweb/pc486/PC486_REVIEW.md).
  pc486-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/pc486 check

  # Playwright suite for the 486DX2-66 front end: boots the real 80486 core
  # + shipped FreeDOS HDD image and CD-ROM ISO, drives keyboard/mouse/floppy/
  # HDD/CD-ROM/speaker/Sound Blaster/theme controls and asserts VGA text-mode
  # screen contents (see PC486_REVIEW.md's Playwright coverage). Two large
  # media artifacts get their own cache, same reasoning as ibmpcat-web-test's
  # single HDD-image cache below: the HDD image comes out of a genuine,
  # slow FreeDOS 1.3 installer run (PC486_REVIEW.md §5), and the CD-ROM ISO
  # is a ~400MB download that's otherwise pointless to repeat every run.
  pc486-web-test:
    needs: pc486-test
    runs-on: ubuntu-latest
    # Suite is host-bound near real 66 MHz (PC486_REVIEW.md §8.6); without a
    # cap a stuck boot waits out the runner's 6 h default. Warm-cache target
    # is under 10 minutes for make test; 45 leaves room for a cold ~8 min
    # HDD-image rebuild plus the suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/pc486/web
        run: make roms

      # mtools builds the CuteMouse driver floppy from the FreeDOS image --
      # see retroweb/pc486/disks/build-ctmouse-floppy.sh.
      - run: sudo apt-get update && sudo apt-get install -y mtools

      - name: Cache pc486 FreeDOS CD-ROM ISO
        id: pc486-cd
        uses: actions/cache@v4
        with:
          path: |
            retroweb/pc486/disks/freedos-cd.iso
            retroweb/pc486/disks/freedos-boot.img
          key: pc486-cd-${{ hashFiles('retroweb/pc486/disks/fetch-freedos-cd.sh') }}

      - name: Fetch pc486 FreeDOS CD-ROM ISO
        if: steps.pc486-cd.outputs.cache-hit != 'true'
        run: bash retroweb/pc486/disks/fetch-freedos-cd.sh

      # restore/save split so a cancelled or timed-out suite still leaves the
      # ~8 min HDD image in cache for the next run (combined cache@v4 only
      # uploads in the post step, which cancel skips).
      - name: Restore pc486 FreeDOS HDD image
        id: pc486-hdd
        uses: actions/cache/restore@v4
        with:
          path: retroweb/pc486/disks/freedos-hdd.img
          key: pc486-hdd-${{ hashFiles('retroweb/pc486/*.h', 'retroweb/pc486/*.cpp', 'retroweb/pc486/disks/*.cpp', 'retroweb/pc486/disks/*.sh', 'retroweb/pc486/roms/*.sh') }}

      - name: Build pc486 FreeDOS HDD image
        if: steps.pc486-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/pc486 hdd-image

      - name: Save pc486 FreeDOS HDD image
        if: steps.pc486-hdd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: retroweb/pc486/disks/freedos-hdd.img
          key: pc486-hdd-${{ hashFiles('retroweb/pc486/*.h', 'retroweb/pc486/*.cpp', 'retroweb/pc486/disks/*.cpp', 'retroweb/pc486/disks/*.sh', 'retroweb/pc486/roms/*.sh') }}

      # Both binaries: the shipped one and the instrumented twin the
      # Performance panel's ?perf loads. Building only the shipped one would
      # let the PC486_PERF paths rot unnoticed -- nothing else compiles them.
      - working-directory: retroweb/pc486/web
        run: make pc486.js pc486-perf.js hdd-image cdrom-image driver-images shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/pc486/web
        run: make test-install

      - working-directory: retroweb/pc486/web
        run: make test

      # The suite above runs against whichever binary ?perf picks, which is
      # the instrumented one. Run the Performance panel's own spec again with
      # that binary hidden, so the shipped-build path -- Tier 1 only, no
      # counters -- is exercised too rather than merely assumed.
      - name: pc486 Performance panel against the shipped binary
        working-directory: retroweb/pc486/web
        run: |
          mv pc486-perf.js pc486-perf.js.hidden
          npx playwright test tests/performance.spec.ts
          mv pc486-perf.js.hidden pc486-perf.js

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc486-playwright-report
          path: |
            retroweb/pc486/web/playwright-report/
            retroweb/pc486/web/test-results/
          retention-days: 7

  # Shared Z80 ISA: named GoogleTest groups (UM0080) plus Frank Cringle's
  # zexdoc documented-opcode exerciser. Pac-Man, Frogger, Scramble, and
  # Galaxian all `needs:` this job; each board then only smokes that the CPU is wired.
  z80-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache zexdoc
        id: zexdoc
        uses: actions/cache@v4
        with:
          path: retroweb/shared/cpu/zex/zexdoc.com
          key: zexdoc-${{ hashFiles('retroweb/shared/cpu/Makefile') }}

      - name: Fetch zexdoc
        if: steps.zexdoc.outputs.cache-hit != 'true'
        run: make -C retroweb/shared/cpu zex/zexdoc.com

      - run: make -C retroweb/shared/cpu check

  # Frogger arcade board: GoogleTest suite over the dual Z80 + Galaxian
  # video + AY-3-8910 + machine (see retroweb/frogger/FROGGER_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  frogger-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/frogger check

  frogger-web-test:
    needs: frogger-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/frogger/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/frogger/web
        run: npm ci

      - working-directory: retroweb/frogger/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/frogger/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frogger-playwright-report
          path: |
            retroweb/frogger/web/playwright-report/
            retroweb/frogger/web/test-results/
          retention-days: 7

  # Scramble arcade board: GoogleTest suite over the dual Z80 + Galaxian
  # video + two AY-3-8910s + PAL 6J (see retroweb/scramble/SCRAMBLE_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  scramble-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/scramble check

  scramble-web-test:
    needs: scramble-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/scramble/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/scramble/web
        run: npm ci

      - working-directory: retroweb/scramble/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/scramble/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scramble-playwright-report
          path: |
            retroweb/scramble/web/playwright-report/
            retroweb/scramble/web/test-results/
          retention-days: 7

  # Galaga arcade board: GoogleTest suite over three Z80s + Namco video +
  # the shared wavetable chip + MB884x (see retroweb/galaga/GALAGA_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  galaga-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/galaga check

  galaga-web-test:
    needs: galaga-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/galaga/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/galaga/web
        run: npm ci

      - working-directory: retroweb/galaga/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/galaga/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: galaga-playwright-report
          path: |
            retroweb/galaga/web/playwright-report/
            retroweb/galaga/web/test-results/
          retention-days: 7

  # Galaxian arcade board: GoogleTest suite over the single Z80 + Galaxian
  # video + discrete sound (see retroweb/galaxian/GALAXIAN_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  galaxian-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/galaxian check

  galaxian-web-test:
    needs: galaxian-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/galaxian/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/galaxian/web
        run: npm ci

      - working-directory: retroweb/galaxian/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/galaxian/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: galaxian-playwright-report
          path: |
            retroweb/galaxian/web/playwright-report/
            retroweb/galaxian/web/test-results/
          retention-days: 7

  # HTML (HTMLHint), JavaScript (ESLint), and C++ (cppcheck) under retroweb/.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retroweb/package-lock.json

      - run: sudo apt-get update && sudo apt-get install -y cppcheck libgtest-dev

      - working-directory: retroweb
        run: npm ci

      - run: make -C retroweb lint

