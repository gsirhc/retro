name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "retroweb/**"
      - "cpu6502/rom/**"
      - ".github/workflows/deploy-emulator.yml"
  pull_request:
    paths:
      - "retroweb/**"
      - "cpu6502/rom/**"
      - ".github/workflows/deploy-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  altair8800-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # native echo demo + GoogleTest unit suite
      - run: make -C retroweb/altair8800 check

      # the diagnostic COMs + CP/M disk this job downloads (pins live in this
      # file, so key the cache on it) -- a cache hit skips both fetch steps
      - name: Cache test images
        id: test-images
        uses: actions/cache@v4
        with:
          path: |
            retroweb/altair8800/cpm/8080PRE.COM
            retroweb/altair8800/cpm/TST8080.COM
            retroweb/altair8800/cpm/CPUTEST.COM
            retroweb/altair8800/cpm/8080EXM.COM
            retroweb/altair8800/cpm/cpm22.dsk
          key: test-images-${{ hashFiles('.github/workflows/deploy-emulator.yml') }}

      # public-domain 8080 diagnostics (kept out of the repo), pinned + checksummed
      - name: Fetch 8080 diagnostic images
        if: steps.test-images.outputs.cache-hit != 'true'
        working-directory: retroweb/altair8800/cpm
        run: |
          base=https://raw.githubusercontent.com/superzazu/8080/c5d403ce7ac967b6ec4980a45b5447d8880888b0/cpu_tests
          for f in 8080PRE.COM TST8080.COM CPUTEST.COM 8080EXM.COM; do
            curl -sSfL -o "$f" "$base/$f"
          done
          sha256sum -c <<'EOF'
          18eb3c79cba42c0718f160be6a1853cb64cdce7aa47d65780189a57bdd98c4e0  8080PRE.COM
          9561c6fb6c99efe3de00eb77e4044fd102151058b39ac2d7bce10483838a08e7  TST8080.COM
          e61a9a75348c774486c2207080ea4effbf6c2367fdace31b0731081a4144030b  CPUTEST.COM
          6e3286e11bb1a8f47b8ee1280b4a067be813193363e3223c99b0d21912f44aeb  8080EXM.COM
          EOF

      # 8080PRE / TST8080 / CPUTEST / 8080EXM via the CP/M host (exits non-zero on failure)
      - run: make -C retroweb/altair8800 cpm

      # a real Altair CP/M 2.2 disk (kept out of the repo), pinned + checksummed
      - name: Fetch a CP/M diskette image
        if: steps.test-images.outputs.cache-hit != 'true'
        working-directory: retroweb/altair8800/cpm
        run: |
          url=https://raw.githubusercontent.com/dhansel/Altair8800/8b0ac49448144f0afed1d5108559dc8507268a85/disks/DISK01.DSK
          curl -sSfL -o cpm22.dsk "$url"
          sha256sum -c <<'EOF'
          730a806ae374c99d8c1ee1c4ab83b674ea7773050300c7d7aa4bfbd29752e4f2  cpm22.dsk
          EOF

      # boot CP/M on the emulated 88-DCDD and run DIR/STAT (exits non-zero if it hangs)
      - run: make -C retroweb/altair8800 cpmdisk DISK=cpm/cpm22.dsk

  # Playwright integration + fidelity suite: drives the real front end in a
  # headless browser and asserts control behaviour + terminal output. A red run
  # here blocks the deploy (build needs it).
  altair8800-web-test:
    needs: altair8800-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/altair8800/web
        run: make retro8080.js roms

      - uses: ./.github/actions/fetch-altair-media

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/altair8800/web
        run: npm ci

      - working-directory: retroweb/altair8800/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/altair8800/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            retroweb/altair8800/web/playwright-report/
            retroweb/altair8800/web/test-results/
          retention-days: 7

  # 6502 Assembler: GoogleTest suite + Klaus Dormann's 6502/65C02 functional
  # test suites, plus building the real ROM from cpu6502/rom/ source (cc65,
  # not fetched -- see CGOAC6502_REVIEW.md §8).
  assembler6502-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65
      - run: make -C retroweb/assembler6502 check

  # Playwright suite for the 6502 Assembler front end: boots the real ROM,
  # drives the board controls, terminal, and ROM programmer in a real browser.
  assembler6502-web-test:
    needs: assembler6502-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/assembler6502/web
        run: make wasm roms examples-bin

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/assembler6502/web
        run: npm ci

      - working-directory: retroweb/assembler6502/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/assembler6502/web
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgoac6502-playwright-report
          path: |
            retroweb/assembler6502/web/playwright-report/
            retroweb/assembler6502/web/test-results/
          retention-days: 7

  # IBM PC/AT: GoogleTest suite over the 80286 core + AT chipset (see
  # IBM_PCAT_REVIEW.md).
  ibmpcat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/ibmpc-at check

  # Playwright suite for the IBM PC/AT front end: boots the real 80286 core
  # + shipped FreeDOS HDD image, drives keyboard/floppy/HDD/speaker/theme
  # controls and asserts EGA text-mode screen contents (see
  # IBM_PCAT_REVIEW.md's Playwright section). Shares the same cached HDD
  # image build as the `build` job below -- see its own comment on the
  # cache step.
  ibmpcat-web-test:
    needs: ibmpcat-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/ibmpc-at/web
        run: make roms

      - name: Cache IBM PC/AT FreeDOS HDD image
        id: ibmpcat-hdd
        uses: actions/cache@v4
        with:
          path: retroweb/ibmpc-at/disks/freedos-hdd.img
          key: ibmpcat-hdd-${{ hashFiles('retroweb/ibmpc-at/*.h', 'retroweb/ibmpc-at/*.cpp', 'retroweb/ibmpc-at/disks/*.cpp', 'retroweb/ibmpc-at/disks/*.sh', 'retroweb/ibmpc-at/roms/*.sh') }}

      - name: Build IBM PC/AT FreeDOS HDD image
        if: steps.ibmpcat-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/ibmpc-at hdd-image

      - working-directory: retroweb/ibmpc-at/web
        run: make ibmpcat.js hdd-image

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/ibmpc-at/web
        run: make test-install

      - working-directory: retroweb/ibmpc-at/web
        run: make test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ibmpcat-playwright-report
          path: |
            retroweb/ibmpc-at/web/playwright-report/
            retroweb/ibmpc-at/web/test-results/
          retention-days: 7

  build:
    needs:
      [
        altair8800-test,
        altair8800-web-test,
        assembler6502-test,
        assembler6502-web-test,
        ibmpcat-test,
        ibmpcat-web-test,
      ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # wasm module + generated ROM images
      - working-directory: retroweb/altair8800/web
        run: make retro8080.js roms

      # ship a ready-to-run machine: Altair 4K/8K BASIC + CP/M 2.2, pinned +
      # checksummed, fetched into the Pages artifact so users need supply nothing.
      - uses: ./.github/actions/fetch-altair-media

      # 6502 Assembler's wasm module + its real ROM, built from cpu6502/rom/
      # source, plus the Example programs' captured-source .bins
      # (gen_example_bin.cpp) `make site` below expects to already be sitting
      # in web/examples/ -- `site` itself only copies web/, it doesn't build
      # anything (see retroweb/Makefile's own `_stage` vs `site` split).
      - working-directory: retroweb/assembler6502/web
        run: make wasm roms examples-bin

      # IBM PC/AT: BIOS/VGA-BIOS ROMs (fetched, checksummed) are cheap; the
      # shipped FreeDOS HDD image is built by actually running the real
      # FreeDOS 1.3 installer end to end against the emulator (see
      # IBM_PCAT_REVIEW.md §11) -- genuinely slow (real minutes: tens of
      # billions of emulated 8MHz cycles, every floppy read paced to its
      # genuine transfer rate), so it's cached across runs, keyed on
      # everything that could change its bytes (the native core + the
      # disk-build harness + the fetch scripts' pinned checksums).
      - name: Cache IBM PC/AT FreeDOS HDD image
        id: ibmpcat-hdd
        uses: actions/cache@v4
        with:
          path: retroweb/ibmpc-at/disks/freedos-hdd.img
          key: ibmpcat-hdd-${{ hashFiles('retroweb/ibmpc-at/*.h', 'retroweb/ibmpc-at/*.cpp', 'retroweb/ibmpc-at/disks/*.cpp', 'retroweb/ibmpc-at/disks/*.sh', 'retroweb/ibmpc-at/roms/*.sh') }}

      - name: Build IBM PC/AT FreeDOS HDD image
        if: steps.ibmpcat-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/ibmpc-at hdd-image

      # IBM PC/AT's wasm module -- hdd-image here just copies the (cached
      # or just-built) native disks/freedos-hdd.img into web/disks/, it
      # doesn't rebuild it (see web/Makefile).
      - working-directory: retroweb/ibmpc-at/web
        run: make ibmpcat.js roms hdd-image

      # stage the site: retroweb/index.html at the root, the Altair front end
      # at /altair8800/, 6502 Assembler at /assembler6502/, IBM PC/AT at /ibmpc-at/
      # -- the C++ core / tests / dev-only files stay out of the artifact.
      # Same target `make preview` uses.
      - working-directory: retroweb
        run: make site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: retroweb/_site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
