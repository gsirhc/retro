name: Deploy site

# Deploy CI runs smoke only (`make test-smoke` / Playwright
# tests/smoke.spec.ts). The full suites run in nightly-full.yml.
# See CLAUDE.md "Smoke vs full".

on:
  push:
    branches: [main]
    paths:
      - "retroweb/**"
      - "cpu6502/rom/**"
      - ".github/workflows/deploy-emulator.yml"
      - ".github/workflows/nightly-full.yml"
  pull_request:
    paths:
      - "retroweb/**"
      - "cpu6502/rom/**"
      - ".github/workflows/deploy-emulator.yml"
      - ".github/workflows/nightly-full.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Smoke: demo + GoogleTest. CP/M diagnostics + disk boot are nightly
  # (nightly-full.yml). See CLAUDE.md "Smoke vs full".
  altair8800-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/altair8800 test-smoke

  # Playwright smoke (tests/smoke.spec.ts). Full fidelity suite is nightly.
  altair8800-web-test:
    needs: altair8800-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/altair8800/web
        run: make retro8080.js roms shared

      - uses: ./.github/actions/fetch-altair-media

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/altair8800/web
        run: npm ci

      - working-directory: retroweb/altair8800/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/altair8800/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            retroweb/altair8800/web/playwright-report/
            retroweb/altair8800/web/test-results/
          retention-days: 7

  # 6502 Assembler smoke: ROM build + GoogleTest. Dormann suites are nightly.
  assembler6502-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65
      - run: make -C retroweb/assembler6502 test-smoke

  # Playwright suite for the 6502 Assembler front end: boots the real ROM,
  # drives the board controls, terminal, and ROM programmer in a real browser.
  assembler6502-web-test:
    needs: assembler6502-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/assembler6502/web
        run: make wasm roms examples-bin shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/assembler6502/web
        run: npm ci

      - working-directory: retroweb/assembler6502/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/assembler6502/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cgoac6502-playwright-report
          path: |
            retroweb/assembler6502/web/playwright-report/
            retroweb/assembler6502/web/test-results/
          retention-days: 7

  # IBM PC/AT: GoogleTest suite over the 80286 core + AT chipset (see
  # IBM_PCAT_REVIEW.md).
  ibmpcat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/ibmpc-at test-smoke

  # Playwright suite for the IBM PC/AT front end: boots the real 80286 core
  # + shipped FreeDOS HDD image, drives keyboard/floppy/HDD/speaker/theme
  # controls and asserts EGA text-mode screen contents (see
  # IBM_PCAT_REVIEW.md's Playwright section). Shares the same cached HDD
  # image build as the `build` job below -- see its own comment on the
  # cache step.
  ibmpcat-web-test:
    needs: ibmpcat-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/ibmpc-at/web
        run: make roms

      - name: Cache IBM PC/AT FreeDOS HDD image
        id: ibmpcat-hdd
        uses: actions/cache@v4
        with:
          path: retroweb/ibmpc-at/disks/freedos-hdd.img
          key: ibmpcat-hdd-${{ hashFiles('retroweb/ibmpc-at/*.h', 'retroweb/ibmpc-at/*.cpp', 'retroweb/ibmpc-at/disks/*.cpp', 'retroweb/ibmpc-at/disks/*.sh', 'retroweb/ibmpc-at/roms/*.sh') }}

      - name: Build IBM PC/AT FreeDOS HDD image
        if: steps.ibmpcat-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/ibmpc-at hdd-image

      - working-directory: retroweb/ibmpc-at/web
        run: make ibmpcat.js hdd-image

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/ibmpc-at/web
        run: make test-install

      - working-directory: retroweb/ibmpc-at/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ibmpcat-playwright-report
          path: |
            retroweb/ibmpc-at/web/playwright-report/
            retroweb/ibmpc-at/web/test-results/
          retention-days: 7

  # Pac-Man arcade board: GoogleTest suite over the tilemap/sprite video
  # + Namco WSG + machine (see retroweb/pacman/PACMAN_REVIEW.md). The
  # shared Z80 ISA is z80-test, not this job; Smoke.HwtestBoots* is the
  # board-level "this CPU actually runs here" check.
  pacman-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/pacman test-smoke

  # Playwright suite for the Pac-Man front end: boots the built-in hardware
  # self-test ROM (no Namco IP), drives keyboard/theme controls, and
  # exercises the user-supplied ROM-set loader against fixture CRCs.
  pacman-web-test:
    needs: pacman-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/pacman/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/pacman/web
        run: npm ci

      - working-directory: retroweb/pacman/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/pacman/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pacman-playwright-report
          path: |
            retroweb/pacman/web/playwright-report/
            retroweb/pacman/web/test-results/
          retention-days: 7

  # 486 DX2-66 Gaming PC: GoogleTest suite over the 80486 core + chipset,
  # WD1003/ATAPI CD-ROM, floppy, VGA/VBE, PS/2 mouse and Sound Blaster 16
  # (see retroweb/pc486/PC486_REVIEW.md).
  pc486-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/pc486 test-smoke

  # Playwright suite for the 486 DX2-66 front end: boots the real 80486 core
  # + shipped FreeDOS HDD image and CD-ROM ISO, drives keyboard/mouse/floppy/
  # HDD/CD-ROM/speaker/Sound Blaster/theme controls and asserts VGA text-mode
  # screen contents (see PC486_REVIEW.md's Playwright coverage). Two large
  # media artifacts get their own cache, same reasoning as ibmpcat-web-test's
  # single HDD-image cache below: the HDD image comes out of a genuine,
  # slow FreeDOS 1.3 installer run (PC486_REVIEW.md §5), and the CD-ROM ISO
  # is a ~400MB download that's otherwise pointless to repeat every run.
  pc486-web-test:
    needs: pc486-test
    runs-on: ubuntu-latest
    # Smoke only (tests/smoke.spec.ts). Full Playwright suite is nightly.
    # Cap still needed: cold HDD rebuild is ~8 min; smoke itself is short.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/pc486/web
        run: make roms

      # mtools builds the CuteMouse driver floppy from the FreeDOS image --
      # see retroweb/pc486/disks/build-ctmouse-floppy.sh.
      - run: sudo apt-get update && sudo apt-get install -y mtools

      - name: Cache pc486 FreeDOS CD-ROM ISO
        id: pc486-cd
        uses: actions/cache@v4
        with:
          path: |
            retroweb/pc486/disks/freedos-cd.iso
            retroweb/pc486/disks/freedos-boot.img
          key: pc486-cd-${{ hashFiles('retroweb/pc486/disks/fetch-freedos-cd.sh') }}

      - name: Fetch pc486 FreeDOS CD-ROM ISO
        if: steps.pc486-cd.outputs.cache-hit != 'true'
        run: bash retroweb/pc486/disks/fetch-freedos-cd.sh

      # restore/save split so a cancelled or timed-out suite still leaves the
      # ~8 min HDD image in cache for the next run (combined cache@v4 only
      # uploads in the post step, which cancel skips).
      - name: Restore pc486 FreeDOS HDD image
        id: pc486-hdd
        uses: actions/cache/restore@v4
        with:
          path: retroweb/pc486/disks/freedos-hdd.img
          key: pc486-hdd-${{ hashFiles('retroweb/pc486/*.h', 'retroweb/pc486/*.cpp', 'retroweb/pc486/disks/*.cpp', 'retroweb/pc486/disks/*.sh', 'retroweb/pc486/roms/*.sh') }}

      - name: Build pc486 FreeDOS HDD image
        if: steps.pc486-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/pc486 hdd-image

      - name: Save pc486 FreeDOS HDD image
        if: steps.pc486-hdd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: retroweb/pc486/disks/freedos-hdd.img
          key: pc486-hdd-${{ hashFiles('retroweb/pc486/*.h', 'retroweb/pc486/*.cpp', 'retroweb/pc486/disks/*.cpp', 'retroweb/pc486/disks/*.sh', 'retroweb/pc486/roms/*.sh') }}

      # Both binaries: the shipped one and the instrumented twin the
      # Performance panel's ?perf loads. Building only the shipped one would
      # let the PC486_PERF paths rot unnoticed -- nothing else compiles them.
      - working-directory: retroweb/pc486/web
        run: make pc486.js pc486-perf.js hdd-image cdrom-image driver-images shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/pc486/web
        run: make test-install

      - working-directory: retroweb/pc486/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc486-playwright-report
          path: |
            retroweb/pc486/web/playwright-report/
            retroweb/pc486/web/test-results/
          retention-days: 7

  # Shared Z80 ISA smoke: named GoogleTest groups (UM0080). zexdoc is nightly.
  z80-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/shared/cpu test-smoke

  # Shared NMOS 6502 ISA smoke. Klaus Dormann is nightly (`make dormann`).
  mos6502-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/shared/cpu test-smoke-mos6502

  # Asteroids arcade board: GoogleTest over the 6502 + DVG + machine
  # (see retroweb/asteroids/ASTEROIDS_REVIEW.md). Shared ISA is mos6502-test.
  asteroids-test:
    needs: mos6502-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/asteroids test-smoke

  asteroids-web-test:
    needs: asteroids-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/asteroids/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/asteroids/web
        run: npm ci

      - working-directory: retroweb/asteroids/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/asteroids/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asteroids-playwright-report
          path: |
            retroweb/asteroids/web/playwright-report/
            retroweb/asteroids/web/test-results/
          retention-days: 7

  # Frogger arcade board: GoogleTest suite over the dual Z80 + Galaxian
  # video + AY-3-8910 + machine (see retroweb/frogger/FROGGER_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  frogger-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/frogger test-smoke

  frogger-web-test:
    needs: frogger-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/frogger/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/frogger/web
        run: npm ci

      - working-directory: retroweb/frogger/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/frogger/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frogger-playwright-report
          path: |
            retroweb/frogger/web/playwright-report/
            retroweb/frogger/web/test-results/
          retention-days: 7

  # Scramble arcade board: GoogleTest suite over the dual Z80 + Galaxian
  # video + two AY-3-8910s + PAL 6J (see retroweb/scramble/SCRAMBLE_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  scramble-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/scramble test-smoke

  scramble-web-test:
    needs: scramble-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/scramble/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/scramble/web
        run: npm ci

      - working-directory: retroweb/scramble/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/scramble/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scramble-playwright-report
          path: |
            retroweb/scramble/web/playwright-report/
            retroweb/scramble/web/test-results/
          retention-days: 7

  # Galaga arcade board: GoogleTest suite over three Z80s + Namco video +
  # the shared wavetable chip + MB884x (see retroweb/galaga/GALAGA_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  galaga-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/galaga test-smoke

  galaga-web-test:
    needs: galaga-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/galaga/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/galaga/web
        run: npm ci

      - working-directory: retroweb/galaga/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/galaga/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: galaga-playwright-report
          path: |
            retroweb/galaga/web/playwright-report/
            retroweb/galaga/web/test-results/
          retention-days: 7

  # Galaxian arcade board: GoogleTest suite over the single Z80 + Galaxian
  # video + discrete sound (see retroweb/galaxian/GALAXIAN_REVIEW.md).
  # Shared Z80 ISA is z80-test; Smoke.HwtestBoots* is the board smoke.
  galaxian-test:
    needs: z80-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C retroweb/galaxian test-smoke

  galaxian-web-test:
    needs: galaxian-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - working-directory: retroweb/galaxian/web
        run: make wasm roms shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - working-directory: retroweb/galaxian/web
        run: npm ci

      - working-directory: retroweb/galaxian/web
        run: npx playwright install --with-deps chromium

      - working-directory: retroweb/galaxian/web
        run: make test-smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: galaxian-playwright-report
          path: |
            retroweb/galaxian/web/playwright-report/
            retroweb/galaxian/web/test-results/
          retention-days: 7

  # HTML (HTMLHint), JavaScript (ESLint), and C++ (cppcheck) under retroweb/.
  # A red run blocks deploy the same way a red test job does.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retroweb/package-lock.json

      - run: sudo apt-get update && sudo apt-get install -y cppcheck libgtest-dev

      - working-directory: retroweb
        run: npm ci

      - run: make -C retroweb lint

  build:
    needs:
      [
        lint,
        altair8800-test,
        altair8800-web-test,
        assembler6502-test,
        assembler6502-web-test,
        ibmpcat-test,
        ibmpcat-web-test,
        pacman-test,
        pacman-web-test,
        pc486-test,
        pc486-web-test,
        z80-test,
        mos6502-test,
        asteroids-test,
        asteroids-web-test,
        frogger-test,
        frogger-web-test,
        scramble-test,
        scramble-web-test,
        galaxian-test,
        galaxian-web-test,
        galaga-test,
        galaga-web-test,
      ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cc65

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      # wasm module + generated ROM images
      - working-directory: retroweb/altair8800/web
        run: make retro8080.js roms shared

      # ship a ready-to-run machine: Altair 4K/8K BASIC + CP/M 2.2, pinned +
      # checksummed, fetched into the Pages artifact so users need supply nothing.
      - uses: ./.github/actions/fetch-altair-media

      # 6502 Assembler's wasm module + its real ROM, built from cpu6502/rom/
      # source, plus the Example programs' captured-source .bins
      # (gen_example_bin.cpp) `make site` below expects to already be sitting
      # in web/examples/ -- `site` itself only copies web/, it doesn't build
      # anything (see retroweb/Makefile's own `_stage` vs `site` split).
      - working-directory: retroweb/assembler6502/web
        run: make wasm roms examples-bin shared

      # IBM PC/AT: BIOS/VGA-BIOS ROMs (fetched, checksummed) are cheap; the
      # shipped FreeDOS HDD image is built by actually running the real
      # FreeDOS 1.3 installer end to end against the emulator (see
      # IBM_PCAT_REVIEW.md §11) -- genuinely slow (real minutes: tens of
      # billions of emulated 8MHz cycles, every floppy read paced to its
      # genuine transfer rate), so it's cached across runs, keyed on
      # everything that could change its bytes (the native core + the
      # disk-build harness + the fetch scripts' pinned checksums).
      - name: Cache IBM PC/AT FreeDOS HDD image
        id: ibmpcat-hdd
        uses: actions/cache@v4
        with:
          path: retroweb/ibmpc-at/disks/freedos-hdd.img
          key: ibmpcat-hdd-${{ hashFiles('retroweb/ibmpc-at/*.h', 'retroweb/ibmpc-at/*.cpp', 'retroweb/ibmpc-at/disks/*.cpp', 'retroweb/ibmpc-at/disks/*.sh', 'retroweb/ibmpc-at/roms/*.sh') }}

      - name: Build IBM PC/AT FreeDOS HDD image
        if: steps.ibmpcat-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/ibmpc-at hdd-image

      # IBM PC/AT's wasm module -- hdd-image here just copies the (cached
      # or just-built) native disks/freedos-hdd.img into web/disks/, it
      # doesn't rebuild it (see web/Makefile).
      - working-directory: retroweb/ibmpc-at/web
        run: make ibmpcat.js roms hdd-image shared

      # Pac-Man arcade board's wasm module + generated hardware self-test ROM
      - working-directory: retroweb/pacman/web
        run: make wasm roms shared

      - working-directory: retroweb/frogger/web
        run: make wasm roms shared

      - working-directory: retroweb/scramble/web
        run: make wasm roms shared

      - working-directory: retroweb/galaxian/web
        run: make wasm roms shared

      - working-directory: retroweb/galaga/web
        run: make wasm roms shared

      - working-directory: retroweb/asteroids/web
        run: make wasm roms shared

      # 486 DX2-66: BIOS/VGA-BIOS ROMs (fetched, checksummed) are cheap; the
      # shipped FreeDOS HDD image is built by actually running the real
      # FreeDOS 1.3 installer end to end against the emulator (see
      # PC486_REVIEW.md §5) -- genuinely slow, so it's cached across runs,
      # keyed on everything that could change its bytes. The CD-ROM ISO is
      # a ~400MB download with its own cache.
      # mtools builds the CuteMouse driver floppy from the FreeDOS image --
      # see retroweb/pc486/disks/build-ctmouse-floppy.sh.
      - run: sudo apt-get update && sudo apt-get install -y mtools

      - name: Cache pc486 FreeDOS CD-ROM ISO
        id: pc486-cd
        uses: actions/cache@v4
        with:
          path: |
            retroweb/pc486/disks/freedos-cd.iso
            retroweb/pc486/disks/freedos-boot.img
          key: pc486-cd-${{ hashFiles('retroweb/pc486/disks/fetch-freedos-cd.sh') }}

      - name: Fetch pc486 FreeDOS CD-ROM ISO
        if: steps.pc486-cd.outputs.cache-hit != 'true'
        run: bash retroweb/pc486/disks/fetch-freedos-cd.sh

      - name: Restore pc486 FreeDOS HDD image
        id: pc486-hdd
        uses: actions/cache/restore@v4
        with:
          path: retroweb/pc486/disks/freedos-hdd.img
          key: pc486-hdd-${{ hashFiles('retroweb/pc486/*.h', 'retroweb/pc486/*.cpp', 'retroweb/pc486/disks/*.cpp', 'retroweb/pc486/disks/*.sh', 'retroweb/pc486/roms/*.sh') }}

      - name: Build pc486 FreeDOS HDD image
        if: steps.pc486-hdd.outputs.cache-hit != 'true'
        run: make -C retroweb/pc486 hdd-image

      - name: Save pc486 FreeDOS HDD image
        if: steps.pc486-hdd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: retroweb/pc486/disks/freedos-hdd.img
          key: pc486-hdd-${{ hashFiles('retroweb/pc486/*.h', 'retroweb/pc486/*.cpp', 'retroweb/pc486/disks/*.cpp', 'retroweb/pc486/disks/*.sh', 'retroweb/pc486/roms/*.sh') }}

      - working-directory: retroweb/pc486/web
        run: make pc486.js pc486-perf.js roms hdd-image cdrom-image driver-images shared

      # stage the site: retroweb/index.html at the root, the Altair front end
      # at /altair8800/, 6502 Assembler at /assembler6502/, IBM PC/AT at
      # /ibmpc-at/, Pac-Man at /pacman/, Frogger at /frogger/, Galaxian at
      # /galaxian/, Galaga at /galaga/, Scramble at /scramble/, 486 DX2-66 at
      # /pc486/ -- the C++ core / tests / dev-only files stay out of the
      # artifact.
      # Same target `make preview` uses.
      - working-directory: retroweb
        run: make site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: retroweb/_site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
